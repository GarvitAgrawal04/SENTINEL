 font-size="12" font-weight="400" fill="#5fd09a" text-anchor="start" >clean · 240 tokens · cycle safe</text><path class="flow" d="M264,166 L330,166" stroke="#ff7b66" stroke-width="2" fill="none" stroke-linecap="round" /><path d="M321,161 L330,166 L321,171" fill="none" stroke="#ff7b66" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path class="flow" d="M154,192 L154,230" stroke="#f0b357" stroke-width="2" fill="none" stroke-linecap="round" /><path d="M149,221 L154,230 L159,221" fill="none" stroke="#f0b357" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path class="flow" d="M264,256 L330,256" stroke="#5fd09a" stroke-width="2" fill="none" stroke-linecap="round" /><path d="M321,251 L330,256 L321,261" fill="none" stroke="#5fd09a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><rect x="44" y="304" width="506" height="172" rx="8" fill="#0e1320" stroke="#242d45" stroke-width="1" /><text x="60" y="330" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif" font-size="13" font-weight="600" fill="#eef0f6" text-anchor="start" >Measured on 50 Public Agent Files (bench/results):</text><text x="60" y="356" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif" font-size="13" font-weight="400" fill="#5fd09a" text-anchor="start" >• Median token delta: -20.0 tokens (net -1,463 tokens saved)</text><text x="60" y="382" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif" font-size="13" font-weight="400" fill="#a3abbb" text-anchor="start" >• Safe auto-fixes applied: 302 across 35 repos (70% had hygiene debt)</text><text x="60" y="408" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif" font-size="12.5" font-weight="400" fill="#a3abbb" text-anchor="start" >• D001 dead imports pruned · D004 duplicate rules kept-first · D008 ANSI stripped</text><text x="60" y="434" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif" font-size="13" font-weight="500" fill="#7398ff" text-anchor="start" >• Max token delta: 0 (hygiene fixes strictly reduce or preserve budget)</text><text x="60" y="458" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#7d8696" text-anchor="start" >• Evaluated across 372 public repos: &gt;5% classified as OBSERVATION</text><rect x="606" y="60" width="550" height="436" rx="12" fill="#131929" stroke="#242d45" stroke-width="1" /><text x="626" y="92" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif" font-size="12" font-weight="700" fill="#5fd09a" text-anchor="start" letter-spacing="1.2">2. GATED SAFE REWRITE</text><text x="626" y="116" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif" font-size="13" font-weight="400" fill="#a3abbb" text-anchor="start" >LLM rewrites verified by doctor.gate.check before user review</text><rect x="626" y="140" width="510" height="142" rx="8" fill="#1a2238" stroke="#242d45" stroke-width="1" /><text x="642" y="166" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif" font-size="13.5" font-weight="600" fill="#7398ff" text-anchor="start" >User Action: &#x27;Sentinel: Suggest a safer wording&#x27;</text><text x="642" y="190" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif" font-size="12.5" font-weight="400" fill="#a3abbb" text-anchor="start" >1. Key read securely from SecretStorage (never in settings/workspace)</text><text x="642" y="212" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif" font-size="12.5" font-weight="400" fill="#a3abbb" text-anchor="start" >2. Confirmation modal displays exact redacted prompt + token count</text><text x=