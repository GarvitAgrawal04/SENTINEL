<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 520" width="1180" height="520" role="img" aria-label="Illustration of Sentinel Instruction Doctor: Load Graph, Deterministic Fixes, and Gated Safe Rewrite"><title>Illustration of Sentinel Instruction Doctor: Load Graph, Deterministic Fixes, and Gated Safe Rewrite</title><style>@keyframes flow{to{stroke-dashoffset:-28}} .flow{stroke-dasharray:6 8;animation:flow 1.6s linear infinite} @media (prefers-reduced-motion:reduce){.flow{animation:none}}</style><rect x="0.5" y="0.5" width="1179" height="519" rx="14" fill="#0e1320" stroke="#2a3147" stroke-width="1" /><rect x="0.5" y="0.5" width="1179" height="40" rx="14" fill="#161c2e" stroke="none" stroke-width="1.5" /><rect x="1" y="26" width="1178" height="15" fill="#161c2e"/><rect x="16" y="8" width="170" height="32" rx="8" fill="#0e1320" stroke="none" stroke-width="1.5" /><text x="28" y="29" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="13" font-weight="600" fill="#7398ff" text-anchor="start" >Instruction Doctor</text><text x="1160" y="26" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#7d8696" text-anchor="end" >load graph · deterministic hygiene · gated safe rewrite</text><rect x="24" y="60" width="550" height="436" rx="12" fill="#131929" stroke="#242d45" stroke-width="1" /><text x="44" y="92" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif" font-size="12" font-weight="700" fill="#7398ff" text-anchor="start" letter-spacing="1.2">1. INSTRUCTION LOAD GRAPH &amp; HYGIENE</text><text x="44" y="116" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif" font-size="13" font-weight="400" fill="#a3abbb" text-anchor="start" >Root entry point with import traversal, cycle detection &amp; token budget</text><rect x="44" y="140" width="220" he