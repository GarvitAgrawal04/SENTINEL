<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 360" width="1280" height="360" role="img" aria-label="How Sentinel works: find, compare, check, explain, then a trust score"><title>How Sentinel works: find, compare, check, explain, then a trust score</title><style>@keyframes flow{to{stroke-dashoffset:-28}} .flow{stroke-dasharray:6 8;animation:flow 1.6s linear infinite} @media (prefers-reduced-motion:reduce){.flow{animation:none}}</style><rect x="40" y="40" width="218" height="168" rx="18" fill="#161b22" stroke="#30363d" stroke-width="1.4" /><circle cx="74" cy="76" r="17" fill="#7398ff"/><text x="74" y="82" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif" font-size="16" font-weight="700" fill="#0d1117" text-anchor="middle" >1</text><text x="102" y="84" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif" font-size="23" font-weight="700" fill="#eef0f6" text-anchor="start" >Find</text><text x="60" y="132" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif" font-size="15" font-weight="400" fill="#a3abbb" text-anchor="start" >the files agents obey:</text><text x="60" y="154" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif" font-size="15" font-weight="400" fill="#a3abbb" text-anchor="start" >notes, hooks, tool servers</text><path class="flow" d="M262,124 L286,124" stroke="#7d8696" stroke-width="2" fill="none" stroke-linecap="round" /><path d="M277,119 L286,124 L277,129" fill="none" stroke="#7d8696" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><rect x="290" y="40" width="218" height="168" rx="18" fill="#161b22" stroke="#30363d" stroke-width="1.4" /><circle cx="324" cy="76" r="17" fill="#7398ff"/><text x="324" y="82" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif" font-size="16" font-weight="700" fill="#0d1117" text-anchor="middle" >2</text><text x="352" y="84" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif" font-size="23" font-weight="700" fill="#eef0f6" text-anchor="start" >Compare</text><text x="310" y="132" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif" font-size="15" font-weight="400" fill="#a3abbb" text-anchor="start" >before and after a change:</text><text x="310" y="154" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif" font-size="15" font-weight="400" fill="#a3abbb" text-anchor="start" >what vanished, what flipped</text><path class="flow" d="M512,124 L536,124" stroke="#7d8696" stroke-width="2" fill="none" stroke-linecap="round" /><path d="M527,119 L536,124 L527,129" fill="none" stroke="#7d8696" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><rect x="540" y="40" width="218" height="168" rx="18" fill="#161b22" stroke="#30363d" stroke-width="1.4" /><circle cx="574" cy="76" r="17" fill="#7398ff"/><text x="574" y="82" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif" font-size="16" font-weight="700" fill="#0d1117" text-anchor="middle" >3</text><text x="602" y="84" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif" font-size="23" font-weight="700" fill="#eef0f6" text-anchor="start" >Check</text><text x="560" y="132" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif" font-size="15" font-weight="400" fill="#a3abbb" text-anchor="start" >26 fixed rules, offline.</text><text x="560" y="154" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif" font-size="15" font-weight="400" fill="#a3abbb" text-anchor="start" >Same input, same answer</text><path class="flow" d="M762,124 L786,124" stroke="#7d8696" stroke-width="2" fill="none" stroke-linecap="round" /><path d="M777,119 L786,124 L777,129" fill="none" stroke="#7d8696" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><rect x="790" y="40" width="218" height="168" rx="18" fill="#161b22" stroke="#30363d" stroke-width="1.4" /><circle cx="824" cy="76" r="17" fill="#7398ff"/><text x="824" y="82" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif" font-size="16" font-weight="700" fill="#0d1117" text-anchor="middle" >4</text><text x="852" y="84" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif" font-size="23" font-weight="700" fill="#eef0f6" text-anchor="start" >Explain</text><text x="810" y="132" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif" font-size="15" font-weight="400" fill="#a3abbb" text-anchor="start" >one plain sentence and</text><text x="810" y="154" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif" font-size="15" font-weight="400" fill="#a3abbb" text-anchor="start" >one fix per problem</text><path class="flow" d="M1012,124 L1040,124" stroke="#7d8696" stroke-width="2" fill="none" stroke-linecap="round" /><path d="M1031,119 L1040,124 L1031,129" fill="none" stroke="#7d8696" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><rect x="1044" y="40" width="196" height="168" rx="18" fill="#1b2442" stroke="#7398ff" stroke-width="1.4" /><text x="1142" y="82" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif" font-size="19" font-weight="700" fill="#eef0f6" text-anchor="middle" >Trust score</text><text x="1142" y="128" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif" font-size="40" font-weight="750" fill="#7398ff" text-anchor="middle" >100</text><text x="1142" y="156" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif" font-size="14" font-weight="500" fill="#a3abbb" text-anchor="middle" >minus each problem</text><text x="1142" y="186" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif" font-size="13" font-weight="400" fill="#a3abbb" text-anchor="middle" >arithmetic always shown</text><rect x="540" y="246" width="468" height="74" rx="14" fill="none" stroke="#7d8696" stroke-width="1.4" stroke-dasharray="6 6"/><path d="M649,208 L649,246" stroke="#7d8696" stroke-width="1.4" stroke-dasharray="4 5"/><text x="560" y="276" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif" font-size="15.5" font-weight="650" fill="#eef0f6" text-anchor="start" >Optional AI sandbox · off by default</text><text x="560" y="300" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif" font-size="13.5" font-weight="400" fill="#a3abbb" text-anchor="start" >A test AI follows the file among fake secrets. It can warn, never convict.</text><text x="40" y="292" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif" font-size="17" font-weight="650" fill="#eef0f6" text-anchor="start" >AI may raise a warning.</text><text x="40" y="316" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif" font-size="17" font-weight="650" fill="#7398ff" text-anchor="start" >Only hard evidence can block.</text></svg>
