[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sentinel-md"
version = "0.8.10"
description = "What do the files your AI coding agent obeys make it do? Static rules, sandbox detonation, a gate and a signed AGENTS.lock."
readme = "README.md"
license = { text = "Apache-2.0" }
authors = [{ name = "Mayan Kamboj" }, { name = "Garvit Agrawal" }]
requires-python = ">=3.10"
dependencies = ["fastapi==0.141.1", "python-multipart==0.0.32", "pydantic==2.13.5"]
[project.optional-dependencies]
# Exact, tested versions live in requirements.txt / requirements-dev.txt. These are the compatible ranges.
sign = ["cryptography>=42"]
api = ["fastapi>=0.111", "uvicorn>=0.29", "python-multipart>=0.0.9", "pydantic>=2", "cryptography>=42"]
dev = ["pytest>=8", "httpx>=0.27", "jsonschema>=4", "fastapi>=0.111", "python-multipart>=0.0.9", "pydantic>=2", "cryptography>=42"]

[project.scripts]
sentinel = "sentinel.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["sentinel*"]

[tool.vercel]
entrypoint = "sentinel.api:app"

[tool.pytest.ini_options]
testpaths = ["tests"]
