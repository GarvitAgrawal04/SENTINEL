# Agent behaviour diff on every pull request. Needs no secret: only the public key on the base branch.
name: sentinel
on: { pull_request: {} }             # every pull request, whatever its base branch
permissions: { contents: read, pull-requests: write }
jobs:
  behaviour-diff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with: { fetch-depth: 0 }          # the base ref must be available
      - uses: ./action                     # other repositories use: GarvitAgrawal04/SENTINEL/action@main
        with: { fail-on: compromised }
