# A direct push with [skip ci] suppresses push workflows. It cannot suppress a schedule.
name: sentinel-nightly
on: { schedule: [{ cron: "17 2 * * *" }], workflow_dispatch: {} }
permissions: { contents: read }
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with: { python-version: "3.12" }
      - run: pip install --quiet ".[sign]"
      - run: sentinel verify --no-pin && sentinel scan .
