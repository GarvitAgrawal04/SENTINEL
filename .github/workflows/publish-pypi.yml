name: Publish to PyPI (Trusted Publishing)

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      target:
        description: "Target registry (testpypi | pypi)"
        required: true
        default: "testpypi"
      dry_run:
        description: "Dry run (build only, do not upload)"
        type: boolean
        default: false

permissions:
  contents: read
  id-token: write  # Required for GitHub OIDC PyPI Trusted Publishing

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    environment:
      name: ${{ github.event.inputs.target || 'pypi' }}
      url: https://pypi.org/p/sentinel-md
    steps:
      - name: Checkout source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: "3.12"

      - name: Install build tooling
        run: python -m pip install --upgrade pip build

      - name: Build sdist and wheel
        run: python -m build

      - name: Verify build artifacts
        run: |
          ls -la dist/
          tar -tzf dist/*.tar.gz | head -n 20

      - name: Publish to TestPyPI
        if: github.event.inputs.target == 'testpypi' && github.event.inputs.dry_run != true
        uses: pypa/gh-action-pypi-publish@4bb033805d9e19112d8c697528791ff53f6c2f74  # release/v1
        continue-on-error: true
        with:
          repository-url: https://test.pypi.org/legacy/
          skip-existing: true
          password: ${{ secrets.TEST_PYPI_API_TOKEN }}

      - name: Publish to PyPI
        id: pypi-publish
        if: (startsWith(github.ref, 'refs/tags/v') || github.event.inputs.target == 'pypi') && github.event.inputs.dry_run != true
        uses: pypa/gh-action-pypi-publish@4bb033805d9e19112d8c697528791ff53f6c2f74  # release/v1
        continue-on-error: true
        with:
          skip-existing: true
          password: ${{ secrets.PYPI_API_TOKEN }}

      - name: PyPI Publish Status Notice
        if: steps.pypi-publish.outcome == 'failure'
        run: |
          echo "::warning title=PyPI Trusted Publishing Pending::Package built and verified, but PyPI Trusted Publisher or PYPI_API_TOKEN is pending configuration on pypi.org for repository GarvitAgrawal04/SENTINEL. Configure at https://pypi.org/manage/account/publishing/ to enable automated PyPI uploads."
