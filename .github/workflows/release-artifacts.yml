name: Build Release Artifacts, SBOM & Sigstore Sign

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

permissions:
  contents: write
  id-token: write  # Required for Sigstore keyless signing via OIDC

jobs:
  build-and-sign:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: "3.12"

      - name: Install build dependencies
        run: pip install --upgrade pip build

      - name: Build sdist and wheel
        run: python -m build

      - name: Generate CycloneDX SBOM
        run: |
          wheel_file=$(ls dist/*.whl | head -n 1)
          python scripts/generate_sbom.py dist/sentinel-md.sbom.json "$wheel_file"

      - name: Generate Checksums
        run: |
          cd dist
          sha256sum * > SHA256SUMS
          cat SHA256SUMS

      - name: Sigstore Sign Release Artifacts
        uses: sigstore/gh-action-sigstore-python@790bc6befb9d733738f18d8f895854b453640ec9  # v3.0.0
        with:
          inputs: >-
            ./dist/*.tar.gz
            ./dist/*.whl
            ./dist/sentinel-md.sbom.json
            ./dist/SHA256SUMS

      - name: Create GitHub Release
        uses: softprops/action-gh-release@e598afbe1493e6b1bafb1f389cabb956eab91231  # v2
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          files: |
            dist/*
          generate_release_notes: true
