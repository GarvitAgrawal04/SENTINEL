# The ONLY place that signs. Keep SENTINEL_SIGNING_KEY in a protected environment
# restricted to the default branch. `sentinel sign` refuses while anything is COMPROMISED.
name: sentinel-sign
on: { push: { branches: [main] } }
permissions: { contents: write }
jobs:
  sign:
    runs-on: ubuntu-latest
    environment: sentinel-signing
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with: { python-version: "3.12" }
      - run: pip install --quiet ".[sign]"          # this repository installs itself; other repositories install from GitHub
      - run: sentinel sign
        env: { SENTINEL_SIGNING_KEY: "${{ secrets.SENTINEL_SIGNING_KEY }}" }
      - run: |
          git config user.name "sentinel-ci"; git config user.email "sentinel-ci@users.noreply.github.com"
          git add AGENTS.lock AGENTS.lock.sig
          git diff --cached --quiet || (git commit -m "sentinel: sign AGENTS.lock" && git push)
